name: 'Setup Build Environment'
description: >-
  Cache SBT/Maven launcher artifacts, optionally cache or restore Coursier and
  the Maven local repository, optionally free disk space, and install a Zulu
  JDK. Callers that use a local composite action must add a bare
  'actions/checkout' step first so the latest action definition is present
  (same bootstrap pattern as checkout-and-sync).
  There is a default cache limit of 10 GB.
inputs:
  java-version:
    description: >-
      JDK version passed to actions/setup-java (Zulu distribution). Empty skips
      the install step (rare; used when the caller installs Java conditionally).
    required: false
    default: ''
  coursier:
    description: >-
      How to handle the Coursier cache: 'cache' (save+restore), 'restore'
      (restore only), or 'none'.
    required: false
    default: 'restore'
  cache-maven-local:
    description: 'Cache ~/.m2/repository'
    required: false
    default: 'false'
  free-disk-space:
    description: >-
      Free disk space before installing Java. 'host' runs
      dev/free_disk_space, 'container' runs dev/free_disk_space_container,
      'none' skips.
    required: false
    default: 'none'

runs:
  using: 'composite'
  steps:
    # Key families are shared across workflows:
    #   SBT:      build-<os>-<hash(build files)>
    #   Coursier: coursier-<os>-<hash(**/pom.xml, **/plugins.sbt)>
    #   Maven:    maven-<os>-java<ver>-<hash(**/pom.xml)>
    - name: Cache SBT and Maven
      uses: actions/cache@v6
      with:
        path: |
          build/apache-maven-*
          build/*.jar
          ~/.sbt
        key: >-
          build-${{ runner.os }}-${{ hashFiles(
          '**/pom.xml',
          'project/build.properties',
          'build/mvn',
          'build/sbt',
          'build/sbt-launch-lib.bash',
          'build/spark-build-info'
          ) }}
        restore-keys: |
          build-${{ runner.os }}-

    - name: Cache Coursier local repository
      if: inputs.coursier == 'cache'
      uses: actions/cache@v6
      with:
        path: ~/.cache/coursier
        key: >-
          coursier-${{ runner.os }}-${{ hashFiles(
          '**/pom.xml',
          '**/plugins.sbt'
          ) }}
        restore-keys: |
          coursier-${{ runner.os }}-

    - name: Restore Coursier local repository
      if: inputs.coursier == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/coursier
        key: >-
          coursier-${{ runner.os }}-${{ hashFiles(
          '**/pom.xml',
          '**/plugins.sbt'
          ) }}
        restore-keys: |
          coursier-${{ runner.os }}-

    - name: Cache Maven local repository
      if: inputs.cache-maven-local == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: >-
          maven-${{ runner.os }}-java${{ inputs.java-version }}-${{ hashFiles(
          '**/pom.xml'
          ) }}
        restore-keys: |
          maven-${{ runner.os }}-java${{ inputs.java-version }}-

    # actions/cache stores '~' paths relative to the workspace. The caches above are saved by
    # jobs on the host runner (workspace /home/runner/work/spark/spark, home /home/runner), so
    # they are restored three levels above the workspace. Inside a job container (workspace
    # /__w/spark/spark) that is '/', not $HOME. In the CI images the JVM's user.home (/root)
    # also differs from $HOME (/github/home). Link the restored directories to where the sbt
    # launcher and Coursier look, so container jobs do not download them again.
    - name: Link restored caches into the JVM user home
      shell: bash
      run: |
        restored_root="$(cd "$GITHUB_WORKSPACE/../../.." && pwd -P)"
        jvm_home="$(getent passwd "$(id -u)" | cut -d: -f6)"
        if [ -z "$jvm_home" ] || [ ! -d "$jvm_home" ] || \
           [ "$restored_root" = "$(cd "$jvm_home" && pwd -P)" ]; then
          exit 0
        fi
        for d in .sbt .cache/coursier; do
          src="$restored_root/$d"
          dst="$jvm_home/$d"
          if [ -d "$src" ] && [ ! -e "$dst" ]; then
            mkdir -p "$(dirname "$dst")"
            ln -s "$src" "$dst"
            echo "Linked $dst -> $src"
          fi
        done

    - name: Free up disk space
      if: inputs.free-disk-space == 'host'
      continue-on-error: true
      shell: bash
      run: timeout --kill-after=30s 10m ./dev/free_disk_space

    - name: Free up disk space
      if: inputs.free-disk-space == 'container'
      continue-on-error: true
      shell: bash
      run: timeout --kill-after=30s 10m ./dev/free_disk_space_container

    - name: Install Java ${{ inputs.java-version }}
      if: inputs.java-version != ''
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: ${{ inputs.java-version }}
